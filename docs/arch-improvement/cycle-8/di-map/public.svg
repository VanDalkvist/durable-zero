<text x="45" y="368" class="">Generic engine получает stdio/Core, но сборка не возвращает ему native view/controller; terminal host требует эти порты.</text>
<text x="45" y="415" class="small">packages/runner/src/composition.ts:83</text>
<a href="https://github.com/VanDalkvist/durable-zero/blob/85afe89869e60b887703d215005d4c37bac3c177/packages/runner/src/composition.ts#L121" target="_blank">
<rect x="35" y="430" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="50" y="455" class="" style="fill:#34d399">G · Native execution environment</text>
<text x="50" y="498" class="">assembleDurableZero({ nativeExecutionEnvFactory</text>
<text x="50" y="519" class="">})</text>
</a>
<rect x="610" y="430" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="625" y="455" class="" style="fill:#34d399">SDK NodeExecutionEnv по умолчанию</text>
<text x="625" y="498" class=""></text>
<rect x="1185" y="430" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="1200" y="455" class="" style="fill:#34d399">ExecutionEnvs → Harness.env → filesystem / exec</text>
<text x="1200" y="476" class="" style="fill:#34d399">tools</text>
<text x="1200" y="498" class=""></text>
<path d="M520 495 L605 495" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
<path d="M1095 495 L1180 495" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
<text x="45" y="594" class="">Нельзя одновременно передать Core factory. Полный SDK-контракт обязателен; CLI/socket-host не выставляют этот параметр.</text>
<text x="45" y="641" class="small">packages/runner/src/composition.ts:121</text>
<a href="https://github.com/VanDalkvist/durable-zero/blob/85afe89869e60b887703d215005d4c37bac3c177/packages/runner/src/composition.ts#L65" target="_blank">
<rect x="35" y="656" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="50" y="681" class="" style="fill:#34d399">G · Core execution environment</text>
<text x="50" y="724" class="">assembleDurableZero({ executionEnvFactory })</text>
</a>
<rect x="610" y="656" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>

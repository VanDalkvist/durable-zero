<path d="M1095 721 L1180 721" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/>
<text x="45" y="820" class="">Core SPI уже native SDK; неподдержанные расширенные операции дают typed unsupported, это не полная замена любого native backend.</text>
<text x="45" y="867" class="small">packages/runner/src/composition.ts:65</text>
<a href="https://github.com/VanDalkvist/durable-zero/blob/85afe89869e60b887703d215005d4c37bac3c177/packages/runner/src/composition.ts#L89" target="_blank">
<rect x="35" y="882" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="50" y="907" class="" style="fill:#34d399">G · Обычные Pi-расширения и tools</text>
<text x="50" y="950" class="">assembleDurableZero({ extensions, skills,</text>
<text x="50" y="971" class="">noGlobalExtensions })</text>
</a>

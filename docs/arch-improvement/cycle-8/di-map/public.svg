<text x="625" y="229" class="" style="fill:#34d399">IAgentEngine → PiDurableEngine по умолчанию</text>
<text x="625" y="272" class=""></text>
<rect x="1185" y="204" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="1200" y="229" class="" style="fill:#34d399">SessionCoordinator.engine.start / submit /</text>
<text x="1200" y="250" class="" style="fill:#34d399">abort / close</text>
<text x="1200" y="272" class=""></text>

<text x="625" y="724" class=""></text>
<rect x="1185" y="656" width="480" height="137" rx="10" fill="#132034" stroke="#34d399" stroke-width="1.7"/>
<text x="1200" y="681" class="" style="fill:#34d399">ExecutionEnvs → native Harness.env</text>
<text x="1200" y="724" class=""></text>

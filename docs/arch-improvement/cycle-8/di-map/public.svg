<text x="45" y="1046" class="">Это работающий путь добавления, но не API удаления/замены стандартных builtins или интегратора MCP.</text>
<text x="45" y="1093" class="small">packages/runner/src/composition.ts:89</text>
<a href="https://github.com/VanDalkvist/durable-zero/blob/85afe89869e60b887703d215005d4c37bac3c177/packages/runner/src/composition.ts#L161" target="_blank">

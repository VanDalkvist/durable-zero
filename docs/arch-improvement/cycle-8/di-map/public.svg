<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1576" viewBox="0 0 1700 1576" role="img" aria-label="02 · Где DI / внешнее подключение уже есть"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0;font-size:16px}.small{font-size:13px;fill:#a8b6cc}.title{font-family:system-ui,sans-serif;font-size:29px;font-weight:700}.head{font-family:system-ui,sans-serif;font-size:20px;font-weight:600}</style><rect width="100%" height="100%" fill="#0b1220"/><text x="35" y="44" class="title">02 · Где DI / внешнее подключение уже есть</text><text x="35" y="74" class="small">Текущий PR85afe89 · читайте каждую строку слева направо · подробные ограничения и файлы в atlas.html</text>
<rect x="35" y="95" width="12" height="12" rx="2" fill="#34d399"/>
<text x="55" y="108" class="small">G: явная передача</text>
<rect x="355" y="95" width="12" height="12" rx="2" fill="#fbbf24"/>
<text x="375" y="108" class="small">Y: нижний API</text>
<rect x="675" y="95" width="12" height="12" rx="2" fill="#fb7185"/>
<text x="695" y="108" class="small">R: выбор зашит</text>
<rect x="995" y="95" width="12" height="12" rx="2" fill="#94a3b8"/>
<text x="1015" y="108" class="small">D: не подключено</text>
<rect x="1315" y="95" width="12" height="12" rx="2" fill="#60a5fa"/>
<text x="1335" y="108" class="small">N: native owner</text>
<text x="35" y="136" class="small">Цвет = способ подключения, не итог тестов. Низкий уровень API не равен assembleDurableZero().</text>
<text x="35" y="183" class="head">1. Где передаётся / где выбор зашит</text>
<text x="610" y="183" class="head">2. Что выбрано сейчас</text>
<text x="1185" y="183" class="head">3. Реальный потребитель</text>
<a href="https://github.com/VanDalkvist/durable-zero/blob/85afe89869e60b887703d215005d4c37bac3c177/packages/runner/src/composition.ts#L83" target="_blank">

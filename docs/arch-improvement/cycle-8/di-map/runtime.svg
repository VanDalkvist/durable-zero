<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" role="img" aria-label="01 · Кто запускает и кто исполняет"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0;font-size:16px}.small{font-size:13px;fill:#a8b6cc}.title{font-family:system-ui,sans-serif;font-size:29px;font-weight:700}.head{font-family:system-ui,sans-serif;font-size:20px;font-weight:600}</style><rect width="100%" height="100%" fill="#0b1220"/><text x="35" y="44" class="title">01 · Кто запускает и кто исполняет</text><text x="35" y="74" class="small">Фактические процессы и сообщения · prompt возвращает admission, результат приходит событиями · не graph imports</text>
<rect x="35" y="95" width="12" height="12" rx="2" fill="#34d399"/>
<text x="55" y="108" class="small">G: явная передача</text>
<rect x="355" y="95" width="12" height="12" rx="2" fill="#fbbf24"/>
<text x="375" y="108" class="small">Y: нижний API</text>
<rect x="675" y="95" width="12" height="12" rx="2" fill="#fb7185"/>
<text x="695" y="108" class="small">R: выбор зашит</text>
<rect x="995" y="95" width="12" height="12" rx="2" fill="#94a3b8"/>
<text x="1015" y="108" class="small">D: не подключено</text>
<rect x="1315" y="95" width="12" height="12" rx="2" fill="#60a5fa"/>
<text x="1335" y="108" class="small">N: native owner</text>
<text x="35" y="136" class="small">Цвет = способ подключения, не итог тестов. Низкий уровень API не равен assembleDurableZero().</text>
<rect x="30" y="178" width="400" height="670" rx="14" fill="none" stroke="#40546f" stroke-dasharray="8 5"/><rect x="460" y="178" width="1210" height="670" rx="14" fill="none" stroke="#40546f" stroke-dasharray="8 5"/>
<text x="50" y="211" class="head">Клиентский процесс</text>

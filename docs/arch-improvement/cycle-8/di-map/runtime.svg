<text x="725" y="615" class="small" style="fill:#fbbf24">Harness: models / registry tools</text>
<path d="M1460 802 L1460 875 L230 875 L230 365" fill="none" stroke="#34d399" stroke-dasharray="8 5" stroke-width="2" marker-end="url(#arr)"/>
<text x="475" y="900" class="small" style="fill:#34d399">Native state/events → local-runtime notifications → ZeroTerminalClient → UI</text>
<text x="60" y="415" class="head">Альтернативный вход:</text>
<text x="60" y="450" class="">cli → runner/main.ts →</text>
<text x="60" y="471" class="">assembleDurableZero(); тот же</text>
<text x="60" y="492" class="">backend через stdio</text>
<text x="510" y="410" class="small">local-runtime требует native view/controller;</text>
<text x="510" y="435" class="small">custom IAgentEngine сам по себе их не даёт.</text>

<text x="75" y="270" class="" style="fill:#34d399">local-terminal</text>
<text x="75" y="313" class="">ZeroTerminalClient + terminal-ui</text>
<rect x="510" y="245" width="340" height="115" rx="10" fill="#132034" stroke="#60a5fa" stroke-width="1.7"/>
<text x="525" y="270" class="" style="fill:#60a5fa">local-runtime</text>
<text x="525" y="313" class="">Unix socket JSON-RPC; admission</text>
<text x="525" y="334" class="">/ reload queue</text>
<rect x="900" y="245" width="340" height="115" rx="10" fill="#132034" stroke="#60a5fa" stroke-width="1.7"/>
<text x="915" y="270" class="" style="fill:#60a5fa">runner</text>
<text x="915" y="313" class="">assembleDurableZero(); одна</text>
<text x="915" y="334" class="">готовая сборка</text>
